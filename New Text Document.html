```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AVENGERS: ENDGAME</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

button,a{
    font-family:inherit;
}

#intro{
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:opacity 2s ease;
}

#intro.fade{
    opacity:0;
    pointer-events:none;
}

#reactor{
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid #00c8ff;

    background:
        radial-gradient(
            circle,
            white 0%,
            #9ff5ff 10%,
            #00aaff 30%,
            #002638 65%,
            #000 70%
        );

    box-shadow:
        0 0 15px #00c8ff,
        0 0 40px #008cff,
        0 0 80px #006eff;

    transform:scale(0.05);
    opacity:0;

    animation:reactorBoot 3s forwards;
}

@keyframes reactorBoot{

    0%{
        transform:scale(0.05);
        opacity:0;
    }

    50%{
        transform:scale(0.7);
        opacity:0.5;
    }

    75%{
        transform:scale(1.15);
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

#core{
    position:absolute;
    width:32px;
    height:32px;
    border-radius:50%;
    border:4px solid white;
    box-shadow:0 0 25px white;
}

#bootText{
    position:absolute;
    top:65%;
    color:#55dfff;
    font-size:11px;
    letter-spacing:6px;
    opacity:0;
    animation:textAppear 2s 2s forwards;
}

@keyframes textAppear{
    to{
        opacity:1;
    }
}


/* BACKGROUND TRAILER */

#backgroundTrailer{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;

    opacity:0;
    filter:
        brightness(0.35)
        contrast(1.2);

    transition:opacity 3s ease;

    z-index:0;
}

#backgroundTrailer.show{
    opacity:0.55;
}


/* CINEMATIC OVERLAY */

#overlay{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 5%,
            rgba(0,0,0,0.45) 55%,
            rgba(0,0,0,0.95) 100%
        );

    z-index:1;
}


/* STARS */

#stars{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
}


/* MAIN */

#main{
    position:relative;
    z-index:3;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    opacity:0;

    transition:
        opacity 2s ease,
        transform 0.2s ease;
}

#main.show{
    opacity:1;
}


/* SMALL TITLE */

#system{
    color:#65ddff;
    font-size:10px;
    letter-spacing:6px;
    margin-bottom:15px;
}


/* ENDGAME */

#title{

    margin:0;

    font-size:
        clamp(55px,11vw,140px);

    letter-spacing:
        clamp(7px,1.5vw,18px);

    font-weight:900;

    color:white;

    opacity:0;

    transform:scale(1.5);

    text-shadow:
        0 0 10px white,
        0 0 30px #00aaff,
        0 0 70px #0077ff;

    transition:
        opacity 2s ease,
        transform 2s ease;
}

#title.show{
    opacity:1;
    transform:scale(1);
}


/* AVENGERS */

#avengers{

    margin:0;

    font-size:
        clamp(50px,10vw,130px);

    letter-spacing:
        clamp(5px,1.2vw,15px);

    font-weight:900;

    color:#e21b23;

    opacity:0;

    transform:scale(1.5);

    text-shadow:
        0 0 10px white,
        0 0 30px red,
        0 0 70px #ff0000;

    position:absolute;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}

#avengers.show{
    opacity:1;
    transform:scale(1);
}


/* SUBTITLE */

#subtitle{

    margin-top:20px;

    color:#bbb;

    font-size:13px;

    letter-spacing:7px;

    opacity:0;

    transition:opacity 2s ease;
}

#subtitle.show{
    opacity:1;
}


/* BUTTONS */

#buttons{

    margin-top:40px;

    opacity:0;

    transform:translateY(20px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}

#buttons.show{
    opacity:1;
    transform:translateY(0);
}

.btn{

    display:inline-block;

    padding:15px 28px;

    margin:7px;

    border-radius:3px;

    text-decoration:none;

    color:white;

    font-size:12px;

    letter-spacing:3px;

    font-weight:bold;

    cursor:pointer;

    transition:
        transform 0.3s,
        box-shadow 0.3s,
        background 0.3s;
}

.btn:hover{
    transform:scale(1.08);
}

.ticket{

    border:1px solid #e21b23;

    background:
        rgba(220,0,0,0.12);

    box-shadow:
        0 0 15px rgba(255,0,0,0.5);
}

.ticket:hover{

    background:#e21b23;

    box-shadow:
        0 0 30px red;
}

.trailerBtn{

    border:1px solid #00bfff;

    background:
        rgba(0,130,255,0.12);

    box-shadow:
        0 0 15px rgba(0,180,255,0.5);
}

.trailerBtn:hover{

    background:#008cff;

    box-shadow:
        0 0 30px #00c8ff;
}


/* TRAILER MODAL */

#trailerScreen{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,0.96);

    z-index:200;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;
}

#trailerScreen.show{
    display:flex;
}

#fullscreenTrailer{

    width:min(90vw,1200px);

    max-height:75vh;

    box-shadow:
        0 0 50px #0077ff;
}

#close{

    margin-top:20px;

    padding:10px 25px;

    background:none;

    color:white;

    border:1px solid #555;

    cursor:pointer;

    letter-spacing:3px;
}


/* MOBILE */

@media(max-width:600px){

    #reactor{
        width:90px;
        height:90px;
    }

    #buttons{
        display:flex;
        flex-direction:column;
    }

    .btn{
        width:220px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     MUSIC
     
     REPLACE:
     "endgame-music.mp3"
     
     with your music filename.
     ========================================================= -->

<audio id="music" loop>
    <source src="endgame-music.mp3" type="audio/mpeg">
</audio>


<!-- =========================================================
     BACKGROUND TRAILER
     
     REPLACE:
     "endgame-trailer.mp4"
     
     with your trailer filename.
     
     This video plays silently in the background.
     ========================================================= -->

<video id="backgroundTrailer"
       muted
       loop
       playsinline>

    <source src="endgame-trailer.mp4" type="video/mp4">

</video>


<!-- INTRO -->

<div id="intro">

    <div id="reactor">
        <div id="core"></div>
    </div>

    <div id="bootText">
        STARK SYSTEM INITIALIZING
    </div>

</div>


<!-- CINEMATIC OVERLAY -->

<div id="overlay"></div>


<!-- STARFIELD -->

<div id="stars"></div>


<!-- MAIN CONTENT -->

<div id="main">

    <div id="system">
        STARK INDUSTRIES // SYSTEM ONLINE
    </div>


    <h1 id="title">
        ENDGAME
    </h1>


    <h1 id="avengers">
        AVENGERS
    </h1>


    <div id="subtitle">
        THE FINAL BATTLE
    </div>


    <div id="buttons">

        <!-- TRAILER -->

        <button
            class="btn trailerBtn"
            onclick="watchTrailer()">

            ▶ WATCH TRAILER

        </button>


        <!-- BOOKMYSHOW -->

        <a
            class="btn ticket"
            href="https://in.bookmyshow.com/movies/gaya/avengers-endgame-encore/ET00514163"
            target="_blank">

            🎟 BOOK TICKETS

        </a>

    </div>

</div>


<!-- TRAILER POPUP -->

<div id="trailerScreen">

    <video
        id="fullscreenTrailer"
        controls
        playsinline>

        <!-- SAME TRAILER FILE AS ABOVE -->

        <source src="endgame-trailer.mp4" type="video/mp4">

    </video>


    <button
        id="close"
        onclick="closeTrailer()">

        CLOSE

    </button>

</div>


<script>


/* =========================================================
   STARFIELD
   ========================================================= */

const stars =
    document.getElementById("stars");

for(let i = 0; i < 120; i++){

    const star =
        document.createElement("div");

    star.style.position =
        "absolute";

    star.style.width =
        Math.random()*3 + "px";

    star.style.height =
        star.style.width;

    star.style.background =
        "white";

    star.style.borderRadius =
        "50%";

    star.style.left =
        Math.random()*100 + "%";

    star.style.top =
        Math.random()*100 + "%";

    star.style.opacity =
        Math.random();

    star.animate(
        [
            {opacity:0.1},
            {opacity:1},
            {opacity:0.1}
        ],
        {
            duration:
                1000 + Math.random()*3000,

            iterations:Infinity
        }
    );

    stars.appendChild(star);
}



/* =========================================================
   ELEMENTS
   ========================================================= */

const intro =
    document.getElementById("intro");

const main =
    document.getElementById("main");

const title =
    document.getElementById("title");

const avengers =
    document.getElementById("avengers");

const subtitle =
    document.getElementById("subtitle");

const buttons =
    document.getElementById("buttons");

const music =
    document.getElementById("music");

const backgroundTrailer =
    document.getElementById("backgroundTrailer");



/* =========================================================
   CINEMATIC INTRO
   ========================================================= */

setTimeout(() => {

    /*
       Music starts after user has interacted
       with the page.

       Most browsers block autoplay with sound,
       so the first click anywhere will also
       start it if necessary.
    */

    backgroundTrailer.play()
        .catch(() => {});

    backgroundTrailer.classList.add("show");

    intro.classList.add("fade");

    main.classList.add("show");

}, 4500);



/* =========================================================
   TITLE REVEAL
   ========================================================= */

setTimeout(() => {

    title.classList.add("show");

}, 5200);



/* =========================================================
   AVENGERS REVEAL
   ========================================================= */

setTimeout(() => {

    title.style.opacity = "0";

    avengers.classList.add("show");

}, 8000);



/* =========================================================
   SUBTITLE
   ========================================================= */

setTimeout(() => {

    subtitle.innerText =
        "AVENGERS, ASSEMBLE.";

    subtitle.classList.add("show");

}, 9000);



/* =========================================================
   BUTTONS
   ========================================================= */

setTimeout(() => {

    buttons.classList.add("show");

}, 10500);



/* =========================================================
   START MUSIC AFTER FIRST USER INTERACTION
   ========================================================= */

document.addEventListener(
    "click",
    function startMusic(){

        music.volume = 0.45;

        music.play()
            .catch(() => {});

        document.removeEventListener(
            "click",
            startMusic
        );

    },
    {once:true}
);



/* =========================================================
   TRAILER
   ========================================================= */

const trailerScreen =
    document.getElementById("trailerScreen");

const fullscreenTrailer =
    document.getElementById("fullscreenTrailer");


function watchTrailer(){

    trailerScreen.classList.add("show");

    backgroundTrailer.pause();

    fullscreenTrailer.currentTime = 0;

    fullscreenTrailer.play()
        .catch(() => {});

}



function closeTrailer(){

    fullscreenTrailer.pause();

    trailerScreen.classList.remove("show");

    backgroundTrailer.play()
        .catch(() => {});

}



/* =========================================================
   ESC KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){
            closeTrailer();
        }

    }
);



/* =========================================================
   MOUSE PARALLAX
   ========================================================= */

document.addEventListener(
    "mousemove",
    function(e){

        const x =
            (window.innerWidth / 2 - e.clientX) / 70;

        const y =
            (window.innerHeight / 2 - e.clientY) / 70;

        main.style.transform =
            `rotateY(${x}deg) rotateX(${y}deg)`;

    }
);

</script>

</body>
</html>
